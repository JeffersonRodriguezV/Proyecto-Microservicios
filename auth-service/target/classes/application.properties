spring.application.name=auth-service
server.port=8086

# Base de datos: todo por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Administrador semilla (la contraseña NO lleva valor por defecto)
admin.id=${ADMIN_ID:admin}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health

# JWT: el secreto viene SOLO del entorno (HS256 exige al menos 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

eventos.exchange=ecosistema.eventos