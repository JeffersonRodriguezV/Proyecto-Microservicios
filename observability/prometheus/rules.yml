groups:
  - name: unificadas
    rules:
      - record: service:http_requests:rate1m
        expr: >
          sum by (job) (rate(http_requests_total[1m]))
          or sum by (job) (rate(http_server_requests_seconds_count[1m]))
          or sum by (job) (rate(http_requests_received_total[1m]))

      - record: service:http_errors5xx:ratio1m
        expr: >
          ( sum by (job) (rate(http_requests_total{status=~"5.."}[1m]))
            or sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
            or sum by (job) (rate(http_requests_received_total{code=~"5.."}[1m])) )
          / service:http_requests:rate1m

      - record: service:http_latency_avg_seconds:rate1m
        expr: >
          sum by (job) (rate(http_request_duration_seconds_sum[1m]))
          / sum by (job) (rate(http_request_duration_seconds_count[1m]))
          or sum by (job) (rate(http_server_requests_seconds_sum[1m]))
          / sum by (job) (rate(http_server_requests_seconds_count[1m]))