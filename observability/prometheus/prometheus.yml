global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /metrics
    dns_sd_configs:                    # una réplica por registro A del servicio
      - names: ['api-gateway']
        type: A
        port: 8080
        refresh_interval: 10s

  - job_name: 'empleados-service'
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['empleados-service']
        type: A
        port: 8080
        refresh_interval: 10s

  - job_name: 'departamentos-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['departamentos-service:8081']

  - job_name: 'perfiles-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['perfiles-service:8083']

  - job_name: 'notificaciones-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['notificaciones-service:8084']

  - job_name: 'vacaciones-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['vacaciones-service:8085']

  - job_name: 'auth-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8086']