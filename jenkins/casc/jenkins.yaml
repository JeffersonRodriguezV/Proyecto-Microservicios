jenkins:
  systemMessage: "Jenkins CI - Proyecto Microservicios (configurado con JCasC)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${jenkins_admin_password}"   # Docker secret: /run/secrets/jenkins_admin_password
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:9090/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "Token de analisis de SonarQube"
              secret: "${sonar_token:-pendiente}"   # Docker secret: /run/secrets/sonar_token
          # Credenciales del E2E: se crean desde archivos montados de solo lectura (ver docker-compose.yml).
          # Los .env no estan en el repositorio; sobreviven a reinicios y a recrear Jenkins.
          - file:
              scope: GLOBAL
              id: "env-sistema"
              fileName: ".env"
              description: ".env del sistema"
              secretBytes: "${readFileBase64:/run/secrets/env-sistema}"
          - file:
              scope: GLOBAL
              id: "env-e2e"
              fileName: ".env"
              description: ".env de e2e-tests"
              secretBytes: "${readFileBase64:/run/secrets/env-e2e}"