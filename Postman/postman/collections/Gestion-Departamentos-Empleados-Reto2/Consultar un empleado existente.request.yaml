$kind: http-request
url: http://localhost:8080/empleados/{{empleadoId}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Devuelve el empleado correcto', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.email).to.eql('carlos.ruiz@empresa.com');
      });
    language: text/javascript
order: 5000
