$kind: http-request
url: http://localhost:8081/departamentos/IT
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Devuelve el departamento correcto', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id).to.eql('IT');
      });
    language: text/javascript
order: 2000
