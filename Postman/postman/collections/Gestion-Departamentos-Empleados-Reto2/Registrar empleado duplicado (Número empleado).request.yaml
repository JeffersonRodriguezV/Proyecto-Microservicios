$kind: http-request
url: http://localhost:8080/empleados
method: POST
body:
  type: json
  content: "{\r

    \  \"nombre\": \"Otro\",\r

    \  \"apellido\": \"Nombre\",\r

    \  \"email\": \"otro@empresa.com\",\r

    \  \"numeroEmpleado\": \"EMP-2026-100\",\r

    \  \"cargo\": \"QA\",\r

    \  \"area\": \"Tecnologia\",\r

    \  \"departamentoId\": \"IT\",\r

    \  \"fechaIngreso\": \"2026-03-03\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 400', function () {
          pm.response.to.have.status(400);
      });

      pm.test('El mensaje menciona numeroEmpleado', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.mensaje.toLowerCase()).to.include('numeroempleado');
      });
    language: text/javascript
order: 8000
