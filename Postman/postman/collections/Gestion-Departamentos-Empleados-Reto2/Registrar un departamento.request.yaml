$kind: http-request
url: http://localhost:8081/departamentos
method: POST
body:
  type: json
  content: "{\r

    \  \"id\": \"IT\",\r

    \  \"nombre\": \"Tecnologia\",\r

    \  \"descripcion\": \"Departamento de TI\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('El body devuelve el departamento creado', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id).to.eql('IT');
          pm.expect(jsonData.nombre).to.eql('Tecnologia');
      });
    language: text/javascript
order: 1000
