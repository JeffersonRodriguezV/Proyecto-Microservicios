$kind: http-request
name: "04 - Validacion: fechas incoherentes"
url: http://localhost:8080/vacaciones
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "empleadoId": "{{empleadoIdVacaciones}}",
      "fechaInicio": "{{fechaFin}}",
      "fechaFin": "{{fechaInicio}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 4000
