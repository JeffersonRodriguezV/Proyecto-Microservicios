$kind: http-request
name: "05 - Validacion: fecha en el pasado"
url: http://localhost:8080/vacaciones
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "empleadoId": "{{empleadoIdVacaciones}}",
      "fechaInicio": "2020-01-01",
      "fechaFin": "2020-01-05"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 5000
