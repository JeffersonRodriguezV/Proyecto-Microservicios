$kind: http-request
name: "07 - Validacion: empleado inexistente"
url: http://localhost:8080/vacaciones
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "empleadoId": "NO-EXISTE-999",
      "fechaInicio": "{{fechaFuturaInicio}}",
      "fechaFin": "{{fechaFuturaFin}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 7000
