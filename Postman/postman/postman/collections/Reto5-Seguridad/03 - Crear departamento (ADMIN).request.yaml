$kind: http-request
url: "{{baseUrl}}/departamentos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"id": "D{{rnd}}", "nombre": "Dep {{rnd}}", "descripcion": "Demo"}'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('rnd', Date.now().toString().slice(-8));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 4000
