$kind: http-request
name: 09 - USER no borra empleados -> 403
url: "{{baseUrl}}/empleados/{{empleadoId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenUser}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 10000
