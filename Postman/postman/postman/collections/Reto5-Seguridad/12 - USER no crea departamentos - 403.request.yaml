$kind: http-request
name: 12 - USER no crea departamentos -> 403
url: "{{baseUrl}}/departamentos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"id": "X1", "nombre": "X", "descripcion": "X"}'
auth:
  type: bearer
  credentials:
    token: "{{tokenUser}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 13000
