spring.application.name=gestionempleados
# Puerto de la aplicación
server.port=8080

# ==========================================
# Base de datos MySQL
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / Hibernate
# ==========================================

# Crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL en consola
spring.jpa.show-sql=false

# Formatear SQL
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
spring.web.resources.add-mappings=false

# ==========================================
# Cliente HTTP hacia departamentos-service
# ==========================================
departamentos.service.url=${DEPARTAMENTOS_SERVICE_URL:http://departamentos-service:8081}
departamentos.service.timeout-connect-ms=3000
departamentos.service.timeout-read-ms=3000


# ==========================================
# Circuit Breaker (Resilience4j) - departamentosService
# ==========================================
#Ventana de 10 llamadas para calcular el porcentaje de fallos
resilience4j.circuitbreaker.instances.departamentosService.sliding-window-size=10
#3-5 FALLOS CONSECUTIVOS PARA ABRIR EL CIRCUITO
resilience4j.circuitbreaker.instances.departamentosService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.departamentosService.failure-rate-threshold=50
# Tiempo que el circuito permanece abierto antes de pasar a half-open 30 SEG
resilience4j.circuitbreaker.instances.departamentosService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.departamentosService.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.departamentosService.automatic-transition-from-open-to-half-open-enabled=true

# Exponer el estado del circuito
management.endpoints.web.exposure.include=health,prometheus,circuitbreakers,circuitbreakerevents

# ==========================================
# RabbitMQ
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

eventos.exchange=ecosistema.eventos


# ==========================================
# OpenAPI / Swagger bajo el prefijo /empleados (alcanzable desde el Gateway)
# ==========================================
springdoc.api-docs.path=/empleados/api-docs
springdoc.swagger-ui.path=/empleados/swagger-ui.html

# ==========================================
# Observabilidad (Reto 8)
# ==========================================
# Trazas: todas las peticiones (en producción se bajaría la probabilidad)
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=empleados-service
management.tracing.export.zipkin.endpoint=${OTEL_EXPORTER_ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
# Propagación por el broker: RabbitTemplate inyecta `traceparent` al publicar y el listener lo extrae al consumir
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
# Logs en JSON (formato logstash) con traceId/spanId tomados del MDC; sin banner para no mezclar texto plano
logging.structured.format.console=logstash
logging.structured.json.add.service=empleados-service
spring.main.banner-mode=off

