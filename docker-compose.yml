services:

  # ==========================================================================
  # API GATEWAY (Node.js/Express) - Punto de entrada único al sistema
  # ==========================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"                     # ÚNICO puerto de la API publicado al host
    environment:
      PORT: 8080
      EMPLEADOS_URL: http://empleados-service:8080
      DEPARTAMENTOS_URL: http://departamentos-service:8081
      PERFILES_URL: http://perfiles-service:8083
      NOTIFICACIONES_URL: http://notificaciones-service:8084
      VACACIONES_URL: http://vacaciones-service:8085
    depends_on:
      - empleados-service
      - departamentos-service
      - perfiles-service
      - notificaciones-service
      - vacaciones-service
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # MESSAGE BROKER (RabbitMQ) - Infraestructura de mensajería asincrónica
  # ==========================================================================
  message-broker:
    image: rabbitmq:3-management        # Incluye la Management UI en :15672
    container_name: message-broker
    ports:
      - "15672:15672"                   # UI web de administración (AMQP :5672 queda interno)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Persiste colas, exchanges y mensajes no consumidos
    healthcheck:
      # Verifica que el broker esté LISTO para aceptar conexiones, no solo vivo
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # EMPLEADOS-SERVICE (Java / Spring Boot) - publica eventos
  # ==========================================================================
  empleados-service:
    build:
      context: ./empleados-service
      dockerfile: Dockerfile
    container_name: empleados-service
    expose:
      - "8080"                          # Solo accesible dentro de la red Docker
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-empleados:3306/empleados_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: empleados_user
      SPRING_DATASOURCE_PASSWORD: empleados_pass
      # --- Conexión al broker para PUBLICAR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    depends_on:
      db-empleados:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      # La imagen trae wget (se instala en su Dockerfile)
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/empleados || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # DEPARTAMENTOS-SERVICE (Python / FastAPI)
  # ==========================================================================
  departamentos-service:
    build:
      context: ./departamentos-service
      dockerfile: Dockerfile
    container_name: departamentos-service
    expose:
      - "8081"                          # Solo accesible dentro de la red Docker
    environment:
      DB_URL: postgresql://db-departamentos:5432/departamentos
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      db-departamentos:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
  # ========================
  # BASE DE DATOS: AUTH (MySQL)
  # ========================
  db-auth:
    image: mysql:8.0
    container_name: db-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
      MYSQL_ROOT_PASSWORD: root_auth_pass
    volumes:
      - db-auth-data:/var/lib/mysql
      - ./auth-service/database:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # PERFILES-SERVICE (C# / .NET) - consume eventos + expone REST
  # BD propia: archivo SQLite en el volumen "perfiles-data" (montado en /data)
  # ==========================================================================
  perfiles-service:
    build:
      context: ./perfiles-service
      dockerfile: Dockerfile
    container_name: perfiles-service
    expose:
      - "8083"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/perfiles.db        # Ruta de la BD, dentro del volumen
      # --- Conexión al broker para CONSUMIR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    volumes:
      - perfiles-data:/data             # Persistencia: sobrevive a "docker compose down"
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # NOTIFICACIONES-SERVICE (Go) - puramente reactivo
  # BD propia: archivo SQLite en el volumen "notificaciones-data"
  # ==========================================================================
  notificaciones-service:
    build:
      context: ./notificaciones-service
      dockerfile: Dockerfile
    container_name: notificaciones-service
    expose:
      - "8084"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/notificaciones.db
      # --- Conexión al broker para CONSUMIR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    volumes:
      - notificaciones-data:/data
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # VACACIONES-SERVICE (Node.js) - publica vacaciones.programadas
  # BD propia: archivo SQLite en el volumen "vacaciones-data"
  # ==========================================================================
  vacaciones-service:
    build:
      context: ./vacaciones-service
      dockerfile: Dockerfile
    container_name: vacaciones-service
    expose:
      - "8085"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/vacaciones.db
      # --- Conexión al broker para PUBLICAR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
      # --- Validación síncrona del empleado (decisión documentada en el README) ---
      EMPLEADOS_URL: http://empleados-service:8080
    volumes:
      - vacaciones-data:/data
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BASE DE DATOS: EMPLEADOS (MySQL)
  # ==========================================================================
  db-empleados:
    image: mysql:8.0
    container_name: db-empleados
    environment:
      MYSQL_DATABASE: ${DB_EMPLEADOS_NAME:-empleados_db}
      MYSQL_USER: ${DB_EMPLEADOS_USER:-empleados_user}
      MYSQL_PASSWORD: ${DB_EMPLEADOS_PASSWORD:-empleados_pass}
      MYSQL_ROOT_PASSWORD: ${DB_EMPLEADOS_ROOT_PASSWORD:-root_empleados_pass}
    volumes:
      - db-empleados-data:/var/lib/mysql
      - ./empleados-service/database:/docker-entrypoint-initdb.d:ro # crea el esquema al primer arranque
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BASE DE DATOS: DEPARTAMENTOS (PostgreSQL)
  # ==========================================================================
  db-departamentos:
    image: postgres:16-alpine
    container_name: db-departamentos
    environment:
      POSTGRES_DB: departamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-departamentos-data:/var/lib/postgresql/data
      # Se monta la CARPETA, no el archivo suelto: en Docker Desktop para Windows
      # el montaje de un archivo individual puede convertirse en directorio (bug del Reto 2)
      - ./departamentos-service/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d departamentos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # =========================================================
  # AUTH SERVICE (Reto 5) - emite y gestiona JWT
  # =========================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped

    expose:
      - "8086"    # solo visible dentro de la red; el Gateway lo alcanza como http://auth-service:8086

    environment:
      DB_URL: jdbc:mysql://db-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      RABBITMQ_HOST: message-broker
      # Secreto compartido con el Gateway. Sin valor por defecto: si falta, compose se detiene.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_RESET_EXPIRATION_MINUTES: ${JWT_RESET_EXPIRATION_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}

    depends_on:
      db-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - microservices-network

# ============================================================================
# VOLÚMENES NOMBRADOS
# ============================================================================
volumes:
  rabbitmq-data:                        # Datos de RabbitMQ
  db-empleados-data:                    # MySQL de empleados
  db-departamentos-data:                # PostgreSQL de departamentos
  perfiles-data:                        # SQLite de perfiles
  notificaciones-data:                  # SQLite de notificaciones
  vacaciones-data:                      # SQLite de vacaciones
  db-auth-data:                        # MySQL de auth
# ============================================================================
# REDES
# ============================================================================
networks:
  microservices-network:
    driver: bridge