services:
  database-empleados:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: empleados_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - empleados-data:/var/lib/mysql
      - ./empleados-service/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - empleados-network

  empleados-service:
    build: ./empleados-service
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://database-empleados:3306/empleados_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8081
    depends_on:
      database-empleados:
        condition: service_healthy
    networks:
      - empleados-network

volumes:
  empleados-data:

networks:
  empleados-network: