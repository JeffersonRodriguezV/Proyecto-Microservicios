# ============================================================================
# VOLÚMENES NOMBRADOS
# ============================================================================
volumes:
  rabbitmq-data:                        # Datos de RabbitMQ
  db-empleados-data:                    # MySQL de empleados
  db-departamentos-data:                # PostgreSQL de departamentos
  perfiles-data:                        # SQLite de perfiles
  notificaciones-data:                  # SQLite de notificaciones
  vacaciones-data:                      # SQLite de vacaciones
  db-auth-data:                         # MySQL de auth
  prometheus-data:                      # Histórico de métricas de Prometheus
  loki-data:                            # Índice + chunks de Loki
  grafana-data:                         # Dashboards, usuarios y BD de Grafana
  jenkins_data:                         # Jobs y plugins de Jenkins
  sonar_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  registry_data:                        # Imágenes publicadas en el registry

# ============================================================================
# REDES
# ============================================================================
networks:
  microservices-network:
    # Nombre fijo: los Jenkinsfile lo usan en "docker run --network", no puede depender de la carpeta.
    name: proyecto-microservicios_microservices-network
    driver: bridge