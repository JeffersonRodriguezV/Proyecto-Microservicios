services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"          # ÚNICO puerto publicado al host
    environment:
      - EMPLEADOS_URL=http://empleados-service:8081
      - DEPARTAMENTOS_URL=http://departamentos-service:8082
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - empleados-service
      - departamentos-service

  empleados-service:
    build: ./empleados-service
    container_name: empleados-service
    expose:
      - "8081"               # Solo visible dentro de la red Docker
    networks:
      - microservices-network

  departamentos-service:
    build: ./departamentos-service
    container_name: departamentos-service
    expose:
      - "8082"               # Solo visible dentro de la red Docker
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge