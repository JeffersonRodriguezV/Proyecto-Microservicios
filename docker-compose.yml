services:

  # ==========================================================================
  # API GATEWAY (Node.js/Express) - Punto de entrada único al sistema
  # ==========================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    # Sin container_name ni ports: hay varias réplicas y el único punto de entrada es el balanceador (lb :8080)
    deploy:
      replicas: ${GATEWAY_REPLICAS:-2}
    expose:
      - "8080"
    labels:
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: "PathPrefix(`/`)"
      traefik.http.routers.gateway.entrypoints: "web"
      traefik.http.routers.gateway.middlewares: "reintento@docker"
      traefik.http.services.gateway.loadbalancer.server.port: "8080"
      traefik.http.services.gateway.loadbalancer.healthcheck.path: "/health"
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: "5s"
      traefik.http.services.gateway.loadbalancer.healthcheck.timeout: "3s"
      # Reintenta en otra réplica si la elegida no acepta la conexión (solo fallos de red, no respuestas 5xx)
      traefik.http.middlewares.reintento.retry.attempts: "3"
    environment:
      PORT: 8080
      EMPLEADOS_URL: http://lb:8088        # empleados-service se alcanza por el balanceador interno
      DEPARTAMENTOS_URL: http://departamentos-service:8081
      PERFILES_URL: http://perfiles-service:8083
      NOTIFICACIONES_URL: http://notificaciones-service:8084
      VACACIONES_URL: http://vacaciones-service:8085
      AUTH_URL: http://auth-service:8086
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets: [jwt_secret]
    depends_on:
      lb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      empleados-service:
        condition: service_healthy
      departamentos-service:
        condition: service_started
      perfiles-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      vacaciones-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BALANCEADOR DE CARGA (Traefik) - único punto de entrada; descubre las réplicas por etiquetas
  # y las retira solo cuando fallan su health check (/health cada 5 s).
  #   :8080  (publicado)  -> api-gateway   (varias réplicas)
  #   :8088  (interno)    -> empleados-service (varias réplicas)
  # ==========================================================================
  lb:
    image: traefik:v3.6
    container_name: lb
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proyecto-microservicios_microservices-network
      - --entrypoints.web.address=:8080
      - --entrypoints.interno.address=:8088
      - --ping=true
      - --ping.entrypoint=traefik
      - --entrypoints.traefik.address=:8082
      - --log.level=INFO
    ports:
      - "8080:8080"                     # ÚNICO puerto de la API publicado al host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lectura de etiquetas (descubrimiento de réplicas)
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=traefik", "--entrypoints.traefik.address=:8082"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # MESSAGE BROKER (RabbitMQ) - Infraestructura de mensajería asincrónica
  # ==========================================================================
  message-broker:
    image: rabbitmq:3-management        # Incluye la Management UI en :15672
    container_name: message-broker
    ports:
      - "15672:15672"                   # UI web de administración (AMQP :5672 queda interno)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
    # RabbitMQ rechaza RABBITMQ_DEFAULT_PASS_FILE (variable obsoleta): se lee el secreto justo antes de arrancar
    entrypoint: ["/bin/sh", "-c", "export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbitmq_password); exec docker-entrypoint.sh rabbitmq-server"]
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Persiste colas, exchanges y mensajes no consumidos
    healthcheck:
      # Verifica que el broker esté LISTO para aceptar conexiones, no solo vivo
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # EMPLEADOS-SERVICE (Java / Spring Boot) - publica eventos
  # ==========================================================================
  empleados-service:
    build:
      context: ./empleados-service
      dockerfile: Dockerfile
    # Sin container_name: se ejecuta en varias réplicas (stateless; el estado está en MySQL)
    deploy:
      replicas: ${EMPLEADOS_REPLICAS:-2}
    expose:
      - "8080"                          # Solo accesible dentro de la red Docker, vía el balanceador interno (lb :8088)
    labels:
      traefik.enable: "true"
      traefik.http.routers.empleados.rule: "PathPrefix(`/`)"
      traefik.http.routers.empleados.entrypoints: "interno"
      traefik.http.routers.empleados.middlewares: "reintento@docker"
      traefik.http.services.empleados.loadbalancer.server.port: "8080"
      traefik.http.services.empleados.loadbalancer.healthcheck.path: "/health"
      traefik.http.services.empleados.loadbalancer.healthcheck.interval: "5s"
      traefik.http.services.empleados.loadbalancer.healthcheck.timeout: "3s"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-empleados:3306/empleados_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_EMPLEADOS_USER:-empleados_user}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_empleados_password
      # --- Conexión al broker para PUBLICAR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    secrets: [db_empleados_password, rabbitmq_password]
    depends_on:
      db-empleados:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      # La imagen trae wget (se instala en su Dockerfile)
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/empleados || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # DEPARTAMENTOS-SERVICE (Python / FastAPI)
  # ==========================================================================
  departamentos-service:
    build:
      context: ./departamentos-service
      dockerfile: Dockerfile
    container_name: departamentos-service
    expose:
      - "8081"                          # Solo accesible dentro de la red Docker
    environment:
      DB_URL: postgresql://db-departamentos:5432/departamentos
      DB_USERNAME: postgres
      DB_PASSWORD_FILE: /run/secrets/db_departamentos_password
    secrets: [db_departamentos_password]
    depends_on:
      db-departamentos:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ========================
  # BASE DE DATOS: AUTH (MySQL)
  # ========================
  db-auth:
    image: mysql:8.0
    container_name: db-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_auth_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_auth_root_password
    secrets: [db_auth_password, db_auth_root_password]
    volumes:
      - db-auth-data:/var/lib/mysql
      - ./auth-service/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_auth_root_password)\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # PERFILES-SERVICE (C# / .NET) - consume eventos + expone REST
  # BD propia: archivo SQLite en el volumen "perfiles-data" (montado en /data)
  # ==========================================================================
  perfiles-service:
    build:
      context: ./perfiles-service
      dockerfile: Dockerfile
    container_name: perfiles-service
    expose:
      - "8083"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/perfiles.db        # Ruta de la BD, dentro del volumen
      # --- Conexión al broker para CONSUMIR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    secrets: [rabbitmq_password]
    volumes:
      - perfiles-data:/data             # Persistencia: sobrevive a "docker compose down"
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # NOTIFICACIONES-SERVICE (Go) - puramente reactivo
  # BD propia: archivo SQLite en el volumen "notificaciones-data"
  # ==========================================================================
  notificaciones-service:
    build:
      context: ./notificaciones-service
      dockerfile: Dockerfile
    container_name: notificaciones-service
    expose:
      - "8084"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/notificaciones.db
      # --- Conexión al broker para CONSUMIR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    secrets: [rabbitmq_password]
    volumes:
      - notificaciones-data:/data
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # VACACIONES-SERVICE (Node.js) - publica vacaciones.programadas
  # BD propia: archivo SQLite en el volumen "vacaciones-data"
  # ==========================================================================
  vacaciones-service:
    build:
      context: ./vacaciones-service
      dockerfile: Dockerfile
    container_name: vacaciones-service
    expose:
      - "8085"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/vacaciones.db
      # --- Conexión al broker para PUBLICAR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      # --- Validación síncrona del empleado (decisión documentada en el README) ---
      EMPLEADOS_URL: http://lb:8088
      # --- Scheduler (Reto 5): frecuencia configurable y zona horaria que define "hoy" ---
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: ${VACACIONES_SCHEDULER_SECONDS:-60}
      TZ: America/Bogota
      # Endpoints de desarrollo forzar-inicio / forzar-fin: solo para demos y pruebas
      DEV_ENDPOINTS: ${VACACIONES_DEV_ENDPOINTS:-true}
    secrets: [rabbitmq_password]
    volumes:
      - vacaciones-data:/data
    depends_on:
      lb:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BASE DE DATOS: EMPLEADOS (MySQL)
  # ==========================================================================
  db-empleados:
    image: mysql:8.0
    container_name: db-empleados
    environment:
      MYSQL_DATABASE: ${DB_EMPLEADOS_NAME:-empleados_db}
      MYSQL_USER: ${DB_EMPLEADOS_USER:-empleados_user}
      MYSQL_PASSWORD_FILE: /run/secrets/db_empleados_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_empleados_root_password
    secrets: [db_empleados_password, db_empleados_root_password]
    volumes:
      - db-empleados-data:/var/lib/mysql
      - ./empleados-service/database:/docker-entrypoint-initdb.d:ro # crea el esquema al primer arranque
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_empleados_root_password)\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BASE DE DATOS: DEPARTAMENTOS (PostgreSQL)
  # ==========================================================================
  db-departamentos:
    image: postgres:16-alpine
    container_name: db-departamentos
    environment:
      POSTGRES_DB: departamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_departamentos_password
    secrets: [db_departamentos_password]
    volumes:
      - db-departamentos-data:/var/lib/postgresql/data
      # Se monta la CARPETA, no el archivo suelto: en Docker Desktop para Windows
      # el montaje de un archivo individual puede convertirse en directorio (bug del Reto 2)
      - ./departamentos-service/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d departamentos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # =========================================================
  # AUTH SERVICE (Reto 5) - emite y gestiona JWT
  # =========================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    expose:
      - "8086"    # solo visible dentro de la red; el Gateway lo alcanza como http://auth-service:8086
    environment:
      DB_URL: jdbc:mysql://db-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: auth_user
      DB_PASSWORD_FILE: /run/secrets/db_auth_password
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      # Secreto compartido con el Gateway (archivo montado en /run/secrets, no variable de entorno)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_RESET_EXPIRATION_MINUTES: ${JWT_RESET_EXPIRATION_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@empresa.com}
      SEED_USER_PASSWORD_FILE: /run/secrets/seed_user_password
    secrets: [db_auth_password, rabbitmq_password, jwt_secret, admin_password, seed_user_password]
    depends_on:
      db-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network

  # ==========================================================================
  # BDD TESTS - solo se ejecuta con el perfil "tests"
  # ==========================================================================
  bdd-tests:
    build: ./e2e-tests
    container_name: bdd-tests
    profiles: ["tests"]                 # NO arranca con 'docker compose up'
    depends_on:
      lb:
        condition: service_healthy
      api-gateway:
        condition: service_started
    environment:
      BASE_URL: http://lb:8080            # las pruebas atraviesan el balanceador, como cualquier cliente
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      USER_EMAIL: ${SEED_USER_EMAIL:-user@empresa.com}
      USER_PASSWORD_FILE: /run/secrets/seed_user_password
    secrets: [admin_password, seed_user_password]
    volumes:
      - ./e2e-tests/reports:/app/reports  # los reportes sobreviven al contenedor
    networks:
      - microservices-network

  # ==========================================================================
  # OBSERVABILIDAD: Prometheus / Zipkin / Loki / Promtail / Grafana
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9091:9090"                     # 9090 ocupado por Jenkins en el host; dentro del contenedor sigue siendo 9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus     # Persistencia del histórico de métricas
    networks:
      - microservices-network
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.4.2
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      JAVA_OPTS: "-Xmx256m"             # Zipkin es JVM; acota la memoria
    networks:
      - microservices-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - microservices-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    # La URL del webhook de Discord se lee del secreto con $__file{} en alerting.yml
    secrets: [grafana_admin_password, discord_webhook_url]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - zipkin
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # CI/CD (Reto 7): Jenkins arranca con el sistema; SonarQube y el registry,
  # que consumen mucha RAM, solo con el perfil "ci" (docker compose --profile ci up -d).
  # El pipeline E2E usa el proyecto "e2e" y desactiva estos servicios (docker-compose.e2e.yml).
  # ==========================================================================
  # --- Jenkins: CI/CD, usa docker.sock del host para builds ---
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    user: root  # necesario para leer docker.sock
    restart: unless-stopped
    ports:
      - "9090:8080"    # UI web
      - "50000:50000"  # agentes
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      # JCasC lee ${jenkins_admin_password} y ${sonar_token} directamente de /run/secrets
    secrets: [jenkins_admin_password, sonar_token]
    volumes:
      - jenkins_data:/var/jenkins_home                    # jobs y plugins
      - /var/run/docker.sock:/var/run/docker.sock         # docker-in-docker
      - ./jenkins/casc:/var/jenkins_home/casc_configs:ro  # JCasC
      # Archivos de solo lectura que JCasC convierte en las credenciales env-sistema y env-e2e del pipeline E2E.
      # Los genera scripts/setup-secrets (carpeta secrets/ y e2e-tests/.env, ambas fuera del repositorio).
      - ./secrets/secrets.env:/run/secrets/env-sistema:ro
      - ./e2e-tests/.env:/run/secrets/env-e2e:ro
    networks:
      - microservices-network

  # --- SonarQube: análisis estático de código ---
  sonarqube:
    profiles: ["ci"]                    # solo con: docker compose --profile ci up -d
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"    # UI web
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
    # SonarQube no soporta _FILE: se lee el secreto justo antes de arrancar
    entrypoint: ["/bin/sh", "-c", "export SONAR_JDBC_PASSWORD=$$(cat /run/secrets/sonar_db_password); exec /opt/sonarqube/docker/entrypoint.sh"]
    secrets: [sonar_db_password]
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions   # plugins
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - microservices-network

  # --- BD dedicada de SonarQube (no se reutiliza la de negocio) ---
  sonar-db:
    profiles: ["ci"]                    # solo con: docker compose --profile ci up -d
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD_FILE=/run/secrets/sonar_db_password
    secrets: [sonar_db_password]
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network

  # --- Registry: almacén privado de imágenes Docker ---
  registry:
    profiles: ["ci"]                    # solo con: docker compose --profile ci up -d
    image: registry:2
    container_name: docker-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry   # imágenes publicadas
    networks:
      - microservices-network

# ============================================================================
# SECRETOS (Docker Compose Secrets)
# Cada secreto es un archivo de la carpeta ./secrets, que está en .gitignore y se
# genera con scripts/setup-secrets.sh (o .ps1). Dentro del contenedor aparece como
# /run/secrets/<nombre>; no viaja en variables de entorno ni queda en la imagen.
# Plantilla sin valores reales: ./secrets.example/
# ============================================================================
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  admin_password:
    file: ./secrets/admin_password
  seed_user_password:
    file: ./secrets/seed_user_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password
  db_empleados_password:
    file: ./secrets/db_empleados_password
  db_empleados_root_password:
    file: ./secrets/db_empleados_root_password
  db_auth_password:
    file: ./secrets/db_auth_password
  db_auth_root_password:
    file: ./secrets/db_auth_root_password
  db_departamentos_password:
    file: ./secrets/db_departamentos_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  discord_webhook_url:
    file: ./secrets/discord_webhook_url
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password
  sonar_token:
    file: ./secrets/sonar_token
  sonar_db_password:
