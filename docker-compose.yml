services:

  # ==========================================================================
  # API GATEWAY (Node.js/Express) - Punto de entrada único al sistema
  # ==========================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"                     # ÚNICO puerto de la API publicado al host
    environment:
      PORT: 8080
      EMPLEADOS_URL: http://empleados-service:8080
      DEPARTAMENTOS_URL: http://departamentos-service:8081
      PERFILES_URL: http://perfiles-service:8083
      NOTIFICACIONES_URL: http://notificaciones-service:8084
      VACACIONES_URL: http://vacaciones-service:8085
      AUTH_URL: http://auth-service:8086
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
    depends_on:
      auth-service:
        condition: service_healthy
      empleados-service:
        condition: service_healthy
      departamentos-service:
        condition: service_started
      perfiles-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      vacaciones-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # MESSAGE BROKER (RabbitMQ) - Infraestructura de mensajería asincrónica
  # ==========================================================================
  message-broker:
    image: rabbitmq:3-management        # Incluye la Management UI en :15672
    container_name: message-broker
    ports:
      - "15672:15672"                   # UI web de administración (AMQP :5672 queda interno)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env (ejecute scripts/setup-secrets.sh)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Persiste colas, exchanges y mensajes no consumidos
    healthcheck:
      # Verifica que el broker esté LISTO para aceptar conexiones, no solo vivo
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # EMPLEADOS-SERVICE (Java / Spring Boot) - publica eventos
  # ==========================================================================
  empleados-service:
    build:
      context: ./empleados-service
      dockerfile: Dockerfile
    container_name: empleados-service
    expose:
      - "8080"                          # Solo accesible dentro de la red Docker
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-empleados:3306/empleados_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_EMPLEADOS_USER:-empleados_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_EMPLEADOS_PASSWORD:?Defina DB_EMPLEADOS_PASSWORD en .env}
      # --- Conexión al broker para PUBLICAR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    depends_on:
      db-empleados:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      # La imagen trae wget (se instala en su Dockerfile)
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/empleados || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # DEPARTAMENTOS-SERVICE (Python / FastAPI)
  # ==========================================================================
  departamentos-service:
    build:
      context: ./departamentos-service
      dockerfile: Dockerfile
    container_name: departamentos-service
    expose:
      - "8081"                          # Solo accesible dentro de la red Docker
    environment:
      DB_URL: postgresql://db-departamentos:5432/departamentos
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_DEPARTAMENTOS_PASSWORD:?Defina DB_DEPARTAMENTOS_PASSWORD en .env}
    depends_on:
      db-departamentos:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ========================
  # BASE DE DATOS: AUTH (MySQL)
  # ========================
  db-auth:
    image: mysql:8.0
    container_name: db-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: ${DB_AUTH_PASSWORD:?Defina DB_AUTH_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_AUTH_ROOT_PASSWORD:?Defina DB_AUTH_ROOT_PASSWORD en .env}
    volumes:
      - db-auth-data:/var/lib/mysql
      - ./auth-service/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # PERFILES-SERVICE (C# / .NET) - consume eventos + expone REST
  # BD propia: archivo SQLite en el volumen "perfiles-data" (montado en /data)
  # ==========================================================================
  perfiles-service:
    build:
      context: ./perfiles-service
      dockerfile: Dockerfile
    container_name: perfiles-service
    expose:
      - "8083"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/perfiles.db        # Ruta de la BD, dentro del volumen
      # --- Conexión al broker para CONSUMIR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    volumes:
      - perfiles-data:/data             # Persistencia: sobrevive a "docker compose down"
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # NOTIFICACIONES-SERVICE (Go) - puramente reactivo
  # BD propia: archivo SQLite en el volumen "notificaciones-data"
  # ==========================================================================
  notificaciones-service:
    build:
      context: ./notificaciones-service
      dockerfile: Dockerfile
    container_name: notificaciones-service
    expose:
      - "8084"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/notificaciones.db
      # --- Conexión al broker para CONSUMIR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    volumes:
      - notificaciones-data:/data
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # VACACIONES-SERVICE (Node.js) - publica vacaciones.programadas
  # BD propia: archivo SQLite en el volumen "vacaciones-data"
  # ==========================================================================
  vacaciones-service:
    build:
      context: ./vacaciones-service
      dockerfile: Dockerfile
    container_name: vacaciones-service
    expose:
      - "8085"                          # Detrás del Gateway, sin puerto al host
    environment:
      DB_PATH: /data/vacaciones.db
      # --- Conexión al broker para PUBLICAR eventos ---
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
      # --- Validación síncrona del empleado (decisión documentada en el README) ---
      EMPLEADOS_URL: http://empleados-service:8080
      # --- Scheduler (Reto 5): frecuencia configurable y zona horaria que define "hoy" ---
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: ${VACACIONES_SCHEDULER_SECONDS:-60}
      TZ: America/Bogota
      # Endpoints de desarrollo forzar-inicio / forzar-fin: solo para demos y pruebas
      DEV_ENDPOINTS: ${VACACIONES_DEV_ENDPOINTS:-true}
    volumes:
      - vacaciones-data:/data
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BASE DE DATOS: EMPLEADOS (MySQL)
  # ==========================================================================
  db-empleados:
    image: mysql:8.0
    container_name: db-empleados
    environment:
      MYSQL_DATABASE: ${DB_EMPLEADOS_NAME:-empleados_db}
      MYSQL_USER: ${DB_EMPLEADOS_USER:-empleados_user}
      MYSQL_PASSWORD: ${DB_EMPLEADOS_PASSWORD:?Defina DB_EMPLEADOS_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_EMPLEADOS_ROOT_PASSWORD:?Defina DB_EMPLEADOS_ROOT_PASSWORD en .env}
    volumes:
      - db-empleados-data:/var/lib/mysql
      - ./empleados-service/database:/docker-entrypoint-initdb.d:ro # crea el esquema al primer arranque
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ==========================================================================
  # BASE DE DATOS: DEPARTAMENTOS (PostgreSQL)
  # ==========================================================================
  db-departamentos:
    image: postgres:16-alpine
    container_name: db-departamentos
    environment:
      POSTGRES_DB: departamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_DEPARTAMENTOS_PASSWORD:?Defina DB_DEPARTAMENTOS_PASSWORD en .env}
    volumes:
      - db-departamentos-data:/var/lib/postgresql/data
      # Se monta la CARPETA, no el archivo suelto: en Docker Desktop para Windows
      # el montaje de un archivo individual puede convertirse en directorio (bug del Reto 2)
      - ./departamentos-service/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d departamentos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # =========================================================
  # AUTH SERVICE (Reto 5) - emite y gestiona JWT
  # =========================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    expose:
      - "8086"    # solo visible dentro de la red; el Gateway lo alcanza como http://auth-service:8086
    environment:
      DB_URL: jdbc:mysql://db-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: auth_user
      DB_PASSWORD: ${DB_AUTH_PASSWORD:?Defina DB_AUTH_PASSWORD en .env}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
      # Secreto compartido con el Gateway. Sin valor por defecto: si falta, compose se detiene.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_RESET_EXPIRATION_MINUTES: ${JWT_RESET_EXPIRATION_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@empresa.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Defina SEED_USER_PASSWORD en .env}
    depends_on:
      db-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network

  # ==========================================================================
  # BDD TESTS - solo se ejecuta con el perfil "tests"
  # ==========================================================================
  bdd-tests:
    build: ./e2e-tests
    container_name: bdd-tests
    profiles: ["tests"]                 # NO arranca con 'docker compose up'
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      BASE_URL: http://api-gateway:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_EMAIL: ${SEED_USER_EMAIL}
      USER_PASSWORD: ${SEED_USER_PASSWORD}
    volumes:
      - ./e2e-tests/reports:/app/reports  # los reportes sobreviven al contenedor
    networks:
      - microservices-network

  # ==========================================================================
  # OBSERVABILIDAD: Prometheus / Zipkin / Loki / Promtail / Grafana
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9091:9090"                     # 9090 ocupado por Jenkins en el host; dentro del contenedor sigue siendo 9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus     # Persistencia del histórico de métricas
    networks:
      - microservices-network
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.4.2
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      JAVA_OPTS: "-Xmx256m"             # Zipkin es JVM; acota la memoria
    networks:
      - microservices-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - microservices-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD en .env}
      # Webhook de Discord para las alertas (provisioning en observability/grafana/provisioning/alerting)
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/CAMBIAR_POR_WEBHOOK_REAL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - zipkin
    networks:
      - microservices-network
    restart: unless-stopped

# ============================================================================
# VOLÚMENES NOMBRADOS
# ============================================================================
volumes:
  rabbitmq-data:                        # Datos de RabbitMQ
  db-empleados-data:                    # MySQL de empleados
  db-departamentos-data:                # PostgreSQL de departamentos
  perfiles-data:                        # SQLite de perfiles
  notificaciones-data:                  # SQLite de notificaciones
  vacaciones-data:                      # SQLite de vacaciones
  db-auth-data:                         # MySQL de auth
  prometheus-data:                      # Histórico de métricas de Prometheus
  loki-data:                            # Índice + chunks de Loki
  grafana-data:                         # Dashboards, usuarios y BD de Grafana

# ============================================================================
# REDES
# ============================================================================
networks:
  microservices-network:
    driver: bridge